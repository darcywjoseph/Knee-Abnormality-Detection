[project]
name = "knee-abnormality-detection"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection (Kaggle 2026)"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "pandas>=3.0",
    "pydicom>=3.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "timm>=1.0",
    "torch>=2.14",
    "torchvision>=0.29",
    "tqdm>=4.70",
]

[project.optional-dependencies]
kaggle = ["kaggle>=2.2"]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]
# D107: __init__ arguments are documented in the class docstring (see src/model.py).
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Generated from notebooks/02_baseline_train_2p5d.ipynb by src/nb2script.py; never hand-edited.
"src/train_2p5d.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "E402", "E501", "I001"]
# Markdown tables inside notebook cell strings cannot wrap.
"src/build_cache_v3_notebook.py" = ["E501"]
