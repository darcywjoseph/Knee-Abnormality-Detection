[project]
name = "knee-abnormality-detection"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection (Kaggle 2026)"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "pandas>=3.0",
    "pydicom>=3.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "timm>=1.0",
    "torch>=2.14",
    "torchvision>=0.29",
    "tqdm>=4.70",
]

[project.optional-dependencies]
kaggle = ["kaggle>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/train_2p5d.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
