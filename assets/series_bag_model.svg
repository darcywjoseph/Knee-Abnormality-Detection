<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="1000" height="250" fill="#fcfcfb"/>
  <text x="20" y="30" font-size="15" font-weight="600" fill="#0b0b0b">How a series-bag model processes one study</text>

  <g font-size="12.5" fill="#0b0b0b" text-anchor="middle">
    <rect x="20" y="60" width="140" height="150" rx="8" fill="#ffffff" stroke="#a3a29c"/>
    <text x="90" y="88" font-weight="600">MRI study</text>
    <text x="90" y="112" fill="#52514e">about 5.5 series</text>
    <text x="90" y="130" fill="#52514e">3 planes, mixed</text>
    <text x="90" y="148" fill="#52514e">contrasts</text>
    <text x="90" y="172" fill="#52514e">right knees mirrored</text>
    <text x="90" y="190" fill="#52514e">to the left</text>

    <rect x="188" y="60" width="140" height="150" rx="8" fill="#ffffff" stroke="#a3a29c"/>
    <text x="258" y="88" font-weight="600">Bag of series</text>
    <text x="258" y="112" fill="#52514e">up to 8, placed by</text>
    <text x="258" y="130" fill="#52514e">plane and contrast</text>
    <text x="258" y="154" fill="#52514e">32 slices each</text>
    <text x="258" y="172" fill="#52514e">140 mm crop, 288 px</text>

    <rect x="356" y="60" width="140" height="150" rx="8" fill="#ffffff" stroke="#a3a29c"/>
    <text x="426" y="88" font-weight="600">2.5D images</text>
    <text x="426" y="112" fill="#52514e">slices i−1, i, i+1</text>
    <text x="426" y="130" fill="#52514e">as the 3 channels</text>
    <text x="426" y="154" fill="#52514e">12 per series in</text>
    <text x="426" y="172" fill="#52514e">training, 16 when</text>
    <text x="426" y="190" fill="#52514e">scoring</text>

    <rect x="524" y="60" width="140" height="150" rx="8" fill="#eaf2fc" stroke="#2a78d6"/>
    <text x="594" y="88" font-weight="600">ConvNeXt-Tiny</text>
    <text x="594" y="112" fill="#52514e">ImageNet weights</text>
    <text x="594" y="136" fill="#52514e">one 768-d vector</text>
    <text x="594" y="154" fill="#52514e">per slice</text>

    <rect x="692" y="60" width="160" height="150" rx="8" fill="#eaf2fc" stroke="#2a78d6"/>
    <text x="772" y="88" font-weight="600">Finding attention</text>
    <text x="772" y="112" fill="#52514e">add series-type and</text>
    <text x="772" y="130" fill="#52514e">depth embeddings</text>
    <text x="772" y="154" fill="#52514e">each finding has its</text>
    <text x="772" y="172" fill="#52514e">own softmax over every</text>
    <text x="772" y="190" fill="#52514e">slice of every series</text>

    <rect x="880" y="60" width="100" height="150" rx="8" fill="#ffffff" stroke="#a3a29c"/>
    <text x="930" y="88" font-weight="600">12 logits</text>
    <text x="930" y="112" fill="#52514e">ACL, MCL,</text>
    <text x="930" y="130" fill="#52514e">menisci, OA,</text>
    <text x="930" y="148" fill="#52514e">effusion, ...</text>
  </g>

  <g stroke="#52514e" stroke-width="1.5" marker-end="url(#a)">
    <line x1="162" y1="135" x2="185" y2="135"/>
    <line x1="330" y1="135" x2="353" y2="135"/>
    <line x1="498" y1="135" x2="521" y2="135"/>
    <line x1="666" y1="135" x2="689" y2="135"/>
    <line x1="854" y1="135" x2="877" y2="135"/>
  </g>
  <text x="20" y="236" font-size="12" fill="#52514e">Missing series are masked out, so a study with four series and one with eight go through the same model.</text>
</svg>
